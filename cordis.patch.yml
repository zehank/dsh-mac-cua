# dsh-cua bundle patch
#
# Mounts the Computer Use MCP server when the package is installed as a profile
# bundle (`dsh plugin --profile web add dsh-mac-cua`).
#
# ── One command is required after install ───────────────────────────────────
#
#     dsh-cua-setup --write
#
# Why this cannot be avoided, after trying: the harness spawns stdio servers from
# its own working directory — not the profile directory — so a relative path into
# `node_modules` does not resolve, and the server never starts. An absolute path
# cannot be baked in either, because the install location is not known when the
# package is built. Verified as unavailable: the loader's `!!js` expressions see a
# context with no package directory; the config schema performs no variable
# expansion; and pnpm's `.bin` shims are not on the spawned process's PATH.
#
# The row below therefore mounts the server but does NOT make it run. If it is
# left as-is the tool is simply absent, and the harness boots normally.
# `dsh-cua-setup --write` replaces this row with one carrying absolute paths.
#
# ── Why failOnStartupError is false ────────────────────────────────────────
#
# A desktop-automation plugin must never be able to prevent the harness from
# booting. With this true, the missing path above took the whole product down to
# the safe-mode recovery screen instead of leaving one tool unavailable.
- insert:
    - id: mcp-cua
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cua_repl
        transport: stdio
        command: node
        args:
          - './scripts/serve.js'
        cwd: '.'
        toolCallTimeoutMs: 180000
        failOnStartupError: false
    # Approval gate. Its enable/disable switch in Settings IS the computer-use
    # confirmation gate: the component owns no config and reads nothing, it
    # exists only so the switch is rendered.
    #
    # Keep the RELATIVE specifier. A bare package subpath
    # (`dsh-mac-cua/lib/approval-gate.js`) resolves fine under plain Node and is
    # what readPluginMeta() would need to pick up locale/ card metadata, but it
    # is not verified against the DSH loader's own resolution — and a loader
    # failure here takes the whole insert list down with it, including mcp-cua.
    - id: cua-approval-gate
      name: './lib/approval-gate.js'
      config: {}
